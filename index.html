<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EmbedYap — Embed Install Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:#0C0F14;
    color:#E9EEF5;
    font-family:'Archivo',system-ui,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  #root{height:100vh;width:100vw}
  ::selection{background:rgba(126,120,240,.32)}
  /* thin scrollbars */
  *::-webkit-scrollbar{width:9px;height:9px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:rgba(120,140,170,.28);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:rgba(120,140,170,.45);background-clip:padding-box}
  input,button,select,textarea{font-family:inherit}
  button{cursor:pointer;border:none;background:none;color:inherit}
  @keyframes spark { 0%{transform:scale(0) rotate(0deg);opacity:1} 100%{transform:scale(1.6) rotate(120deg);opacity:0} }
  @keyframes stampIn { 0%{transform:scale(2.4) rotate(-14deg);opacity:0} 55%{transform:scale(.86) rotate(-14deg);opacity:1} 100%{transform:scale(1) rotate(-14deg);opacity:1} }
  @keyframes pinPulse { 0%{box-shadow:0 0 0 0 rgba(47,214,166,.55)} 70%{box-shadow:0 0 0 9px rgba(47,214,166,0)} 100%{box-shadow:0 0 0 0 rgba(47,214,166,0)} }
  @keyframes panelIn { from{transform:translateX(18px);opacity:0} to{transform:translateX(0);opacity:1} }
  @keyframes panelInUp { from{transform:translateY(22px);opacity:0} to{transform:translateY(0);opacity:1} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes growBar { from{transform:scaleY(0)} to{transform:scaleY(1)} }
  @keyframes scan { from{background-position:0 0} to{background-position:0 -1200px} }
  .ey-fade{animation:fadeIn .35s ease both}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important} }
</style>
</head>
<body>
<div id="root"></div>
<!-- nano: in-house ~React-compatible runtime (vanilla, zero deps, no CDN, no build).
     Defines window.React / window.ReactDOM so the precompiled components run unchanged.
     Replaced the React + ReactDOM UMD CDN scripts. See vendor/nano.js. -->
<script src="vendor/nano.js"></script>
<!-- Firebase backend (shared project · namespace embed-tracker) + Ironworker Run backend -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
<script>window.OY_APP_NAME='EmbedYap';</script>
<script src="vendor/openyap-core/openyap-core.js"></script>
<!-- perf: the export libs (SheetJS ~1MB + jsPDF/autotable ~0.4MB) are NOT loaded here.
     They lazy-load on first CSV/XLSX/PDF export via app/exports.js, so a normal page
     view (which never exports) doesn't pay ~1.4MB on the critical path. -->

<script>
(function(){
  const NS='embed-tracker';
  oy.init();                                   // openyap-core: canonical (openyap-prod) config + App Check + auth
  const db=oy.db;
  // Secured rules require sign-in + role, so queue reads until oy is ready; oy renders
  // the sign-in / access-pending gate over the app in the meantime. Writes are user-driven (post-auth).
  let _ready=false; const _q=[];
  const whenReady=fn=>{ _ready?fn():_q.push(fn); };
  oy.ensureAuth(); oy.onReady(()=>{ _ready=true; _q.splice(0).forEach(fn=>fn()); });
  window.fb={
    listen:(p,cb)=>whenReady(()=>db.ref(NS+'/'+p).on('value',s=>cb(s.val()))),
    set:(p,d)=>db.ref(NS+'/'+p).set(d),
    update:(p,d)=>db.ref(NS+'/'+p).update(d),
    remove:(p)=>db.ref(NS+'/'+p).remove(),
    get:(p)=>new Promise(res=>whenReady(()=>db.ref(NS+'/'+p).once('value').then(s=>res(s.val())).catch(()=>res(null)))),
    inc:(p,by)=>db.ref(NS+'/'+p).transaction(v=>(v||0)+by),
    max:(p,v)=>db.ref(NS+'/'+p).transaction(c=>Math.max(c||0,v)),
    rootGet:(p)=>new Promise(res=>whenReady(()=>db.ref(p).once('value').then(s=>res(s.val())).catch(()=>res(null)))),
    rootSet:(p,d)=>db.ref(p).set(d),
  };
})();
</script>
<script src="assets/game-backend.js"></script>
<!-- perf: precompiled modules (npm run build -> dist/*.js), loaded in dependency order.
     No more per-load ?v=Date.now() cache-bust, so the browser caches these between visits.
     Edit app/*.jsx then run `npm run build` before deploying. -->
<script defer src="dist/tokens.js?v=b088c5ac"></script>
<script defer src="dist/iconset.js?v=fc639c28"></script>
<script defer src="dist/data.js?v=88b87699"></script>
<script defer src="dist/ui.js?v=7388f8b9"></script>
<script defer src="dist/exports.js?v=345952d3"></script>
<script defer src="dist/blueprint.js?v=1a8b7373"></script>
<script defer src="dist/SignIn.js?v=8e085184"></script>
<script defer src="dist/MapScreen.js?v=b2977b18"></script>
<script defer src="dist/MapDetail.js?v=c8762a3b"></script>
<script defer src="dist/Dashboard.js?v=62ccb677"></script>
<script defer src="dist/Inventory.js?v=c5d7afe3"></script>
<script defer src="dist/Game.js?v=70bc2e59"></script>
<script defer src="dist/GameDraw.js?v=682f1c64"></script>
<script defer src="dist/Crew.js?v=78358b47"></script>
<script defer src="dist/Profile.js?v=fd96f1e9"></script>
<script defer src="dist/App.js?v=406a0569"></script>
<script defer src="dist/main.js?v=8f63d538"></script>
</body>
</html>
